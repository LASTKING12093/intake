name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Python 3.12.14
        shell: pwsh
        run: ./scripts/get_build_python.ps1
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./.tools/python/python.exe -c "import os; from app import __version__; assert os.environ['RELEASE_TAG'] == 'v' + __version__"
      - name: Scan source and history
        shell: pwsh
        run: ./scripts/scan_secrets.ps1
      - name: Install verified installer compiler
        shell: pwsh
        run: ./scripts/get_release_tools.ps1
      - name: Test and package
        shell: pwsh
        run: ./scripts/release.ps1 -Python (Join-Path $PWD '.tools/python/python.exe')
      - name: Test installation, downloads and uninstall
        shell: pwsh
        run: ./scripts/test_installer.ps1
      - name: Audit packaged files
        shell: pwsh
        run: ./.build-venv/Scripts/python.exe scripts/audit_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intake-windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: intake-windows-x64
          path: release
      - name: Verify checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "INTAKE $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
